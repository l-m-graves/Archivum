name: ci

on:
  push:
  pull_request:

env:
  # vcpkg is checked out at exactly this commit on every runner; it is the
  # same commit as builtin-baseline in vcpkg.json.
  VCPKG_COMMIT: 1577f17ee57f42a0ef6d75bbb82cb37d0b76d7e8

jobs:
  linux:
    name: linux-${{ matrix.preset }} (ubuntu 22.04, gcc 12)
    runs-on: ubuntu-latest
    # The Linux container deployment target is Ubuntu 22.04; CI builds in
    # that exact image so the toolchain matches production.
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sanitized Debug runs fewer randomized iterations; Release runs
          # the large counts the model-based tests are sized for.
          - preset: linux-debug
            triplet: x64-linux-cxx20
            crash_iters: "1000"
          - preset: linux-release
            triplet: x64-linux-cxx20
            crash_iters: "10000"
          # ThreadSanitizer: a separate build (it cannot share one with
          # ASan) with every vcpkg port instrumented too, running every
          # test labelled "concurrency". Added after the Stage 4 pager
          # race: ASan and UBSan do not see data races.
          - preset: linux-tsan
            triplet: x64-linux-cxx20-tsan
            crash_iters: "200"
    env:
      CC: gcc-12
      CXX: g++-12
      DEBIAN_FRONTEND: noninteractive
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: /opt/vcpkg-cache
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          # autoconf, automake, autoconf-archive and libtool: the libsodium port
          # (Argon2id for credentials) is an autotools build.
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build g++-12 \
            curl zip unzip tar pkg-config python3 make perl linux-libc-dev \
            autoconf autoconf-archive automake libtool
          mkdir -p /opt/vcpkg-cache
          cmake --version
          g++-12 --version
      - uses: actions/checkout@v4
      - name: Check out vcpkg at the pinned commit
        run: |
          git init /opt/vcpkg
          git -C /opt/vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C /opt/vcpkg fetch --depth 1 origin ${VCPKG_COMMIT}
          git -C /opt/vcpkg checkout FETCH_HEAD
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*', 'cmake/vcpkg-overlay-ports/**') }}
      - name: JSON boundary rule (docs/json-boundary.md)
        run: |
          # jsoncpp may be named only in the bridge.
          if grep -rIl --include='*.cpp' --include='*.h' -e 'json/json.h' -e 'Json::Value' engine server tests | grep -v 'server/src/http/json_bridge'; then
            echo "jsoncpp used outside server/src/http/json_bridge.*"; exit 1; fi
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Feature probes (docs/cpp-subset.md)
        run: grep -h "ARCHIVUM_HAS_STD_FORMAT" build/${{ matrix.preset }}/CMakeCache.txt
      - name: Test
        env:
          ARCHIVUM_CRASH_ITERS: ${{ matrix.crash_iters }}
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          # halt_on_error: a data race fails the test, it is not a warning.
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows-${{ matrix.config }} (windows-2022, msvc 2022)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            crash_iters: "1000"
          - config: release
            crash_iters: "10000"
    env:
      VCPKG_ROOT: C:\vcpkg-pinned
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
      - name: Check out vcpkg at the pinned commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vcpkg-cache | Out-Null
          git init C:\vcpkg-pinned
          git -C C:\vcpkg-pinned remote add origin https://github.com/microsoft/vcpkg.git
          git -C C:\vcpkg-pinned fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C C:\vcpkg-pinned checkout FETCH_HEAD
          & C:\vcpkg-pinned\bootstrap-vcpkg.bat -disableMetrics
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-cxx20-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*', 'cmake/vcpkg-overlay-ports/**') }}
      - name: Configure
        run: cmake --preset windows
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset windows-${{ matrix.config }}
      - name: Feature probes (docs/cpp-subset.md)
        shell: pwsh
        run: Select-String -Path build/windows/CMakeCache.txt -Pattern "ARCHIVUM_HAS_STD_FORMAT"
      - name: Test
        env:
          ARCHIVUM_CRASH_ITERS: ${{ matrix.crash_iters }}
        run: ctest --preset windows-${{ matrix.config }}

  # The batch-ingest contract against the FastAPI prototype
  # (tests/contract/scenarios.json, the same file the Archivum runner
  # server_contract_test uses). The prototype lives in the private Punchline
  # repository; without a token for it the job says so and passes, so the
  # matrix is never red for a missing secret. Set PUNCHLINE_REPO_TOKEN (a
  # read-only token for l-m-graves/Punchline) to run it.
  contract-fastapi:
    name: contract suite against the FastAPI prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Punchline repository, if a token is configured
        env:
          TOKEN: ${{ secrets.PUNCHLINE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PUNCHLINE_REPO_TOKEN is not set: skipping the FastAPI run (the Archivum runner is in the Linux jobs)"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/l-m-graves/Punchline.git" /tmp/punchline
          python3 -m pip install --quiet -r /tmp/punchline/backend/requirements-dev.txt
          PUNCHLINE_REPO=/tmp/punchline python3 -m pytest tests/contract -q
