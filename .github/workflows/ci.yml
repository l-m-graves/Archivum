name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux-${{ matrix.preset }} (ubuntu 22.04, gcc 12)
    runs-on: ubuntu-latest
    # The Linux container deployment target is Ubuntu 22.04; CI builds in
    # that exact image so the toolchain matches production.
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release]
    env:
      CC: gcc-12
      CXX: g++-12
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build g++-12
          cmake --version
          g++-12 --version
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          ARCHIVUM_CRASH_ITERS: "1000"
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows-${{ matrix.config }} (windows-2022, msvc 2022)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows-${{ matrix.config }}
      - name: Test
        env:
          ARCHIVUM_CRASH_ITERS: "1000"
        run: ctest --preset windows-${{ matrix.config }}
